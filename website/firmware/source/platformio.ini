[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.f_flash = 40000000L
lib_deps = bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Set to 1 if your 4-channel relay shield is active-low (most cheap modules are).
    -DRELAY_ACTIVE_LOW=0
